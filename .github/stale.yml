name: "stale"

issues:
  enabled: false  # 이슈는 stale 처리 안 함

pulls:
  enabled: true
  stale-message: >
    이 AI 초안 PR이 7일 동안 리뷰되지 않았습니다.
    콘텐츠가 유효한 경우 코멘트를 남겨 stale 상태를 해제하세요.
  close-message: >
    14일 동안 활동이 없어 PR을 자동 close합니다.
    필요하면 새 workflow_dispatch로 재생성할 수 있습니다.
  stale-label: "stale"
  days-before-stale: 7
  days-before-close: 7
  only-labels:
    - "auto-draft"  # auto-draft 라벨이 있는 PR만 대상
