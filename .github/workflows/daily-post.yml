name: Daily Blog Post Generator

on:
  schedule:
    - cron: '0 1 * * 1-5'  # 01:00 UTC = 10:00 KST, Mon–Fri
  workflow_dispatch:
    inputs:
      day_override:
        description: '요일 강제 지정 (monday/tuesday/wednesday/thursday/friday)'
        required: false
        type: string

jobs:
  generate-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout blog repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 논문 PDF — 별도 private repo (화요일 전용)
      - name: Checkout source-papers (Tuesday only)
        if: >
          github.event.inputs.day_override == 'tuesday' ||
          (github.event.inputs.day_override == '' && format('{0}', github.run_attempt) == '1')
        uses: actions/checkout@v4
        with:
          repository: younglin90/cfd-source-papers
          ssh-key: ${{ secrets.PAPERS_DEPLOY_KEY }}
          path: source-papers
        continue-on-error: true  # deploy key 없으면 skip, 오류 처리는 스크립트에서

      # LibreOffice 캐시 (HWP 변환용)
      - name: Cache LibreOffice
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libreoffice
          version: 1.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run tests
        run: pytest tests/test_generate.py -v --tb=short

      - name: Generate post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAY_OVERRIDE: ${{ github.event.inputs.day_override }}
        run: python scripts/generate_post.py

      - name: Create Pull Request
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: add AI-generated draft post for ${{ env.POST_DATE }}"
          title: "[AI Draft] ${{ env.POST_TITLE }}"
          body: |
            ## AI 자동 생성 초안

            - 날짜: ${{ env.POST_DATE }}
            - 요일 설정: ${{ github.event.inputs.day_override || '자동 감지' }}
            - 생성 모델: claude-sonnet-4-6

            **검토 체크리스트:**
            - [ ] 수식(KaTeX) 렌더링 확인
            - [ ] 코드 블록 언어 지정 확인
            - [ ] 사실 오류 검토
            - [ ] 시각화 컴포넌트 props 확인 (수요일)
            - [ ] draft: true → draft: false 변경 후 머지

            머지하면 Cloudflare Pages에 자동 배포됩니다.
          labels: "auto-draft"
          branch: "draft/${{ env.POST_DATE }}-${{ github.run_number }}"
          delete-branch: true

      - name: Create failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[자동화 실패] ${new Date().toISOString().slice(0,10)} 포스트 생성 실패`;
            const body = [
              '## 실패 정보',
              `- Run: ${context.runId}`,
              `- Branch: ${context.ref}`,
              `- Trigger: ${context.eventName}`,
              '',
              '## 확인 사항',
              '- [ ] ANTHROPIC_API_KEY 유효한지 확인',
              '- [ ] source-docs/index.yaml에 해당 요일 문서 있는지 확인',
              '- [ ] PAPERS_DEPLOY_KEY 만료 여부 확인 (화요일인 경우)',
              '',
              `[Actions 로그 보기](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['automation-failure'],
            });
