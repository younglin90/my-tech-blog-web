name: Link check

# 매주 월 09:00 UTC + 수동 트리거.
# 깨진 링크 발견 시 GitHub Issue 자동 생성/갱신.

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Run link checker
        id: check
        continue-on-error: true
        run: |
          node scripts/check-links.mjs --out broken.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Read broken links
        if: always()
        id: payload
        run: |
          if [ -f broken.json ] && [ "$(cat broken.json)" != "[]" ]; then
            COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('broken.json','utf-8')).length)")
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            BODY=$(node -e "
              const d = JSON.parse(require('fs').readFileSync('broken.json','utf-8'));
              const md = d.slice(0, 50).map(b => '- [' + (b.status || 'ERR') + '] ' + b.url + '\n  in: ' + (b.files || []).slice(0,3).join(', ')).join('\n');
              console.log('## Broken links found (' + d.length + ')\n\nDetected by weekly link check.\n\n' + md);
            ")
            echo "$BODY" > issue-body.md
            echo "has_broken=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_broken=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open / update GitHub Issue
        if: steps.payload.outputs.has_broken == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('issue-body.md', 'utf-8')
            const title = `🔗 Broken links — ${new Date().toISOString().slice(0,10)}`
            // 기존 open issue 검색 후 업데이트, 없으면 생성
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'broken-links',
            })
            if (issues.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues.data[0].number,
                title, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['broken-links'],
              })
            }
