name: Weekly Diversity Audit

# 매주 월요일 09:00 KST(=00:00 UTC) 에 audit-posts.mjs 결과를 GitHub issue 로 게시.
# 자동 포스팅 드리프트(viz 누락, 헤딩 클리셰, 태그 편중)를 사람 눈에 띄게 만든다.

on:
  schedule:
    - cron: '0 0 * * MON'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run audit
        id: audit
        run: |
          node scripts/audit-posts.mjs --all > audit-output.txt 2>&1 || true
          echo 'output<<__AUDIT_EOF__' >> "$GITHUB_OUTPUT"
          cat audit-output.txt >> "$GITHUB_OUTPUT"
          echo '__AUDIT_EOF__' >> "$GITHUB_OUTPUT"
          score=$(grep -oP '종합: \K\d+' audit-output.txt | head -1)
          echo "score=${score:-0}" >> "$GITHUB_OUTPUT"

      - name: Open or update issue
        uses: actions/github-script@v7
        env:
          AUDIT_OUTPUT: ${{ steps.audit.outputs.output }}
          AUDIT_SCORE: ${{ steps.audit.outputs.score }}
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10)
            const score = process.env.AUDIT_SCORE || '0'
            const body = [
              `자동 생성된 주간 다양성 감사 — ${today}`,
              '',
              `\`\`\``,
              process.env.AUDIT_OUTPUT,
              `\`\`\``,
              '',
              `로컬에서 즉시 확인: \`node scripts/audit-posts.mjs --all\``,
            ].join('\n')

            const title = `weekly-audit ${today} (score ${score}/5)`
            // 같은 날짜의 기존 이슈가 있으면 코멘트만 갱신
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'weekly-audit',
              per_page: 100,
            })
            const found = existing.data.find((i) => i.title.startsWith(`weekly-audit ${today}`))
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['weekly-audit'],
              })
            }
