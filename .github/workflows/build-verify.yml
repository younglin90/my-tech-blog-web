name: Build Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (includes static-route verification)
        # 기본 힙(~2GB)으로는 OOM이 난다. 645개 contentlayer 문서 + 3,031개 정적 페이지에
        # 더해 OG 카드 640장을 satori로 굽기 때문에 피크가 2GB를 넘는다.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build
