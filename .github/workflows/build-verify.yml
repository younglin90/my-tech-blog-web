name: Build Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (includes static-route verification)
        # 기본 힙(~2GB)으로는 OOM이 난다(.npmrc의 node-options에도 같은 값이 있다).
        # 이 실패는 예전부터 main에서 계속 나고 있었다 — dc26acf도 같은 2044.7MB에서 죽었다.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build
