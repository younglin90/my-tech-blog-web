#   {파일경로}:                                ← 신 스키마 (섹션 단위 추적)
#     - date: "YYYY-MM-DD"
#       sections: ["쓴 섹션 제목 1", "쓴 섹션 제목 2"]
#     - date: "YYYY-MM-DD"
#       sections: [...]
#
# 로더는 문자열이면 `[{date, sections: []}]`로 정규화해 처리한다.
# 목록에 없는 파일 = 미사용 (우선 선택 대상).

