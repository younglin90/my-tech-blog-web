# Glossary — 용어 사전. 본문에서 정확히 일치하는 용어를 자동 툴팁/링크 처리.
# locale별 정의는 사전이 너무 커지므로 영문 용어 + ko 정의 기본. 추후 확장 가능.
#
# 형식:
#   key: 용어 (대소문자 구분)
#   value:
#     ko: 한국어 정의
#     en: English definition
#     wiki: (선택) wikipedia URL

terms:
  Reynolds:
    ko: "관성력 대 점성력의 비. 층류·난류 천이를 결정하는 기본 무차원수."
    en: "Ratio of inertial to viscous forces. Determines laminar–turbulent transition."
    wiki: "https://en.wikipedia.org/wiki/Reynolds_number"

  CFL:
    ko: "Courant–Friedrichs–Lewy 조건. 명시적 시간 적분의 안정성을 결정. C = uΔt/Δx ≤ C_max."
    en: "Courant–Friedrichs–Lewy condition. Stability bound for explicit time integration."
    wiki: "https://en.wikipedia.org/wiki/Courant%E2%80%93Friedrichs%E2%80%93Lewy_condition"

  Mach:
    ko: "유속/음속 비. 압축성·충격파 발생 여부 판단."
    en: "Flow speed divided by sound speed. Indicates compressibility and shock formation."
    wiki: "https://en.wikipedia.org/wiki/Mach_number"

  Riemann:
    ko: "두 상태 사이의 초기 불연속을 풀어내는 1-D 문제. CFD 수치 플럭스의 기반."
    en: "1-D initial discontinuity problem between two states. Foundation of numerical fluxes in CFD."
    wiki: "https://en.wikipedia.org/wiki/Riemann_problem"

  HLLC:
    ko: "Harten–Lax–van Leer Contact. 접촉 불연속을 처리하는 근사 Riemann solver."
    en: "Harten–Lax–van Leer Contact. Approximate Riemann solver that captures contact discontinuities."

  RANS:
    ko: "Reynolds-Averaged Navier–Stokes. 시간평균을 통해 난류를 모델링한 형태."
    en: "Reynolds-Averaged Navier–Stokes. Time-averaged form for turbulence modeling."

  LES:
    ko: "Large Eddy Simulation. 큰 와류는 직접 풀고 작은 와류는 모델링."
    en: "Large Eddy Simulation. Resolves large vortices, models sub-grid scales."

  DNS:
    ko: "Direct Numerical Simulation. 모든 난류 스케일을 직접 해상."
    en: "Direct Numerical Simulation. Resolves all turbulence scales directly."

  Kolmogorov:
    ko: "에너지 캐스케이드의 가장 작은 스케일. η = (ν³/ε)^(1/4)."
    en: "Smallest scale in the turbulence energy cascade. η = (ν³/ε)^(1/4)."

  VOF:
    ko: "Volume of Fluid. 다상유동에서 각 상의 부피분율을 추적."
    en: "Volume of Fluid. Tracks volume fractions of each phase in multiphase flow."

  EOS:
    ko: "Equation of State. p = f(ρ, e) 형태의 상태방정식."
    en: "Equation of State. Closure relation p = f(ρ, e)."

  OpenFOAM:
    ko: "오픈소스 CFD 라이브러리. 유한체적법 기반."
    en: "Open-source CFD library based on finite volume method."
    wiki: "https://en.wikipedia.org/wiki/OpenFOAM"

  WENO:
    ko: "Weighted Essentially Non-Oscillatory. 충격파 근처에서 비진동 고차 재구성."
    en: "Weighted Essentially Non-Oscillatory. High-order non-oscillatory reconstruction near shocks."

  TVD:
    ko: "Total Variation Diminishing. 비물리적 진동을 막는 단조성 조건."
    en: "Total Variation Diminishing. Monotonicity condition preventing spurious oscillations."

  SIMPLE:
    ko: "Semi-Implicit Method for Pressure-Linked Equations. 비압축성 압력-속도 결합 알고리즘."
    en: "Semi-Implicit Method for Pressure-Linked Equations. Incompressible pressure–velocity coupling."

  PISO:
    ko: "Pressure Implicit with Splitting of Operators. SIMPLE 변형, 비정상 해석에 효율적."
    en: "Pressure Implicit with Splitting of Operators. Efficient for transient flows."

  TENO:
    ko: "Targeted ENO. WENO보다 낮은 분산을 갖는 충격포착 5/6차 정확도 스킴."
    en: "Targeted ENO. Lower-dissipation shock-capturing scheme (5/6th order) than WENO."

  BiCGSTAB:
    ko: "Bi-Conjugate Gradient Stabilized. 비대칭 행렬용 Krylov 솔버, 잔차가 출렁이는 특성."
    en: "Bi-Conjugate Gradient Stabilized. Krylov solver for non-symmetric matrices."
    wiki: "https://en.wikipedia.org/wiki/Biconjugate_gradient_stabilized_method"

  GMRES:
    ko: "Generalized Minimal Residual. 일반 비대칭 행렬에 강건한 Krylov 부분공간 솔버."
    en: "Generalized Minimal Residual. Robust Krylov solver for general non-symmetric systems."
    wiki: "https://en.wikipedia.org/wiki/Generalized_minimal_residual_method"

  Krylov:
    ko: "{r₀, Ar₀, A²r₀, ...} 가 생성하는 부분공간. CG/GMRES/BiCGSTAB 등의 기반."
    en: "Subspace spanned by {r₀, Ar₀, A²r₀, ...}. Foundation of CG/GMRES/BiCGSTAB."
    wiki: "https://en.wikipedia.org/wiki/Krylov_subspace"

  Eikonal:
    ko: "‖∇φ‖ = 1 형태의 정상 PDE. 벽거리·front propagation 계산에 사용."
    en: "Stationary PDE ‖∇φ‖ = 1. Used for wall distance and front propagation."
    wiki: "https://en.wikipedia.org/wiki/Eikonal_equation"

  DGM:
    ko: "Discontinuous Galerkin Method. 요소 경계에서 점프를 허용하는 고차 정확도 FEM 변형."
    en: "Discontinuous Galerkin Method. High-order FEM variant allowing element-boundary jumps."
    wiki: "https://en.wikipedia.org/wiki/Discontinuous_Galerkin_method"

  FEM:
    ko: "Finite Element Method. 변분 약형식과 형상함수 기반의 이산화법."
    en: "Finite Element Method. Discretization via variational weak form and shape functions."
    wiki: "https://en.wikipedia.org/wiki/Finite_element_method"

  FVM:
    ko: "Finite Volume Method. 셀 단위 보존 형태 적분, CFD에서 가장 널리 사용."
    en: "Finite Volume Method. Cell-wise conservative integration; the CFD workhorse."
    wiki: "https://en.wikipedia.org/wiki/Finite_volume_method"

  FDM:
    ko: "Finite Difference Method. 노드 미분 근사 기반의 이산화법."
    en: "Finite Difference Method. Discretization via nodal derivative approximations."
    wiki: "https://en.wikipedia.org/wiki/Finite_difference_method"

  Rhie-Chow:
    ko: "Collocated 격자에서 압력 체커보드를 막는 면 속도 보간 기법."
    en: "Face-velocity interpolation that suppresses pressure checkerboarding on collocated grids."

  Roe:
    ko: "Roe의 평균 행렬을 사용해 Jacobian을 선형화한 근사 Riemann solver."
    en: "Approximate Riemann solver that linearizes the Jacobian via Roe's average."
    wiki: "https://en.wikipedia.org/wiki/Roe_solver"

  AUSM:
    ko: "Advection Upstream Splitting Method. 압력·이류 분리 플럭스 — 다양한 변형(+, +up)."
    en: "Advection Upstream Splitting Method — pressure/advection split flux family."

  PINN:
    ko: "Physics-Informed Neural Network. PDE를 손실에 넣어 학습하는 신경망."
    en: "Physics-Informed Neural Network — embeds PDEs into the training loss."

  Plateau-Rayleigh:
    ko: "표면장력으로 액주가 작은 액적들로 분열하는 불안정성."
    en: "Surface-tension-driven instability that breaks a liquid jet into droplets."
    wiki: "https://en.wikipedia.org/wiki/Plateau%E2%80%93Rayleigh_instability"

  Burgers:
    ko: "u_t + u u_x = ν u_xx. 충격파·점성 효과의 표준 모델 1D 비선형 PDE."
    en: "u_t + u u_x = ν u_xx. Canonical 1D nonlinear PDE modeling shocks and viscosity."
    wiki: "https://en.wikipedia.org/wiki/Burgers%27_equation"

  Galerkin:
    ko: "약형식에서 시험함수와 시도함수 공간을 같게 두는 변분 이산화."
    en: "Variational discretization where trial and test spaces coincide."
    wiki: "https://en.wikipedia.org/wiki/Galerkin_method"

  Quaternion:
    ko: "4성분 초복소수 (w, x, y, z). 짐벌락 없는 3D 회전 표현에 사용."
    en: "Four-component hypercomplex number (w, x, y, z); gimbal-lock-free 3D rotations."
    wiki: "https://en.wikipedia.org/wiki/Quaternion"

  Casulli:
    ko: "Casulli–Walters 의 비구조 천수방정식 semi-implicit 알고리즘."
    en: "Casulli–Walters semi-implicit algorithm for the unstructured shallow-water equations."

  Multigrid:
    ko: "다중 격자 사이를 오가며 저주파·고주파 오차를 동시에 줄이는 가속법."
    en: "Acceleration that cycles between coarse/fine grids to damp low+high frequency errors together."
    wiki: "https://en.wikipedia.org/wiki/Multigrid_method"

  AMR:
    ko: "Adaptive Mesh Refinement. 해의 변화가 큰 영역만 격자를 세분화."
    en: "Adaptive Mesh Refinement — refines the grid only where the solution varies sharply."
    wiki: "https://en.wikipedia.org/wiki/Adaptive_mesh_refinement"

  SPH:
    ko: "Smoothed Particle Hydrodynamics. 메쉬 없이 입자 상호작용 커널로 유체를 이산화."
    en: "Smoothed Particle Hydrodynamics. Mesh-free discretization via particle interaction kernels."
    wiki: "https://en.wikipedia.org/wiki/Smoothed-particle_hydrodynamics"

  LBM:
    ko: "Lattice Boltzmann Method. 볼츠만 운동론을 격자에 이산화 — 병렬성이 뛰어남."
    en: "Lattice Boltzmann Method. Boltzmann kinetics discretized on a lattice; highly parallelizable."
    wiki: "https://en.wikipedia.org/wiki/Lattice_Boltzmann_methods"

  AMG:
    ko: "Algebraic Multigrid. 물리 격자 없이 행렬 그래프로 계층을 구성하는 다중 격자 전처리기."
    en: "Algebraic Multigrid. Multilevel preconditioner built from the matrix graph, no geometric grid needed."
    wiki: "https://en.wikipedia.org/wiki/Multigrid_method#Algebraic_multigrid"

  IMEX:
    ko: "Implicit-Explicit 분리. 강성 항(음압·점성)은 암시적, 비강성 항(이류)은 양시적으로 처리."
    en: "Implicit-Explicit splitting. Stiff terms (pressure, viscosity) implicit; non-stiff (advection) explicit."
    wiki: ""

  MUSCL:
    ko: "Monotone Upstream-centered Schemes for Conservation Laws. 단조 리만-플럭스 기반 2차 공간 정확도 재구성."
    en: "Monotone Upstream-centered Schemes for Conservation Laws. 2nd-order spatial reconstruction with monotone Riemann fluxes."
    wiki: "https://en.wikipedia.org/wiki/MUSCL_scheme"

  Godunov:
    ko: "각 셀 경계에서 리만 문제를 풀어 플럭스를 결정하는 보존형 유한체적 스킴의 토대."
    en: "Conservative finite-volume scheme that solves a Riemann problem at each cell interface to determine fluxes."
    wiki: "https://en.wikipedia.org/wiki/Godunov%27s_scheme"

  ILU:
    ko: "Incomplete LU. 스파스 행렬의 근사 삼각분해. Krylov 솔버의 표준 전처리기."
    en: "Incomplete LU factorization. Approximate triangular decomposition of sparse matrices; standard Krylov preconditioner."
    wiki: "https://en.wikipedia.org/wiki/Incomplete_LU_factorization"

  CG:
    ko: "Conjugate Gradient. 대칭 양정치 행렬에 최적인 Krylov 솔버. O(n^(1/2)) 수렴."
    en: "Conjugate Gradient. Optimal Krylov solver for symmetric positive-definite systems; O(n^(1/2)) convergence."
    wiki: "https://en.wikipedia.org/wiki/Conjugate_gradient_method"

  IBM:
    ko: "Immersed Boundary Method. 복잡한 경계를 직교 격자에 힘 항으로 표현하는 기법."
    en: "Immersed Boundary Method. Represents complex boundaries as body-force terms on Cartesian grids."
    wiki: "https://en.wikipedia.org/wiki/Immersed_boundary_method"
